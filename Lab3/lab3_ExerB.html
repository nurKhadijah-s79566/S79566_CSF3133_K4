
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket Booking</title>
</head>
<body>

<!--
Lists of Errors:
1. Line 1: Missing "html" in DOCTYPE declaration.
2. Line 9: Incorrect closing position of span element.
3. Line 13: Missing semicolon after &amp.
4. Line 14: Total calculation used addition incorrectly for ticket price.
5. Line 18: "emial" should be "email"; required attribute was missing.
6. Line 22: Datalist ID did not match the list attribute.
7. Line 23: Datalist ID was incorrect; changed to "movies".
8. Line 32: Range min and max values were reversed.
9. Line 33: Incorrect output "for" attribute; changed to adult child.
10. Line 38: &Copy; is not a valid HTML entity; changed to &copy;.
11. Lines 54-55: Duplicate closing body and html tags removed.
12. Added minimum and maximum values to ticket quantity inputs.
-->

<!-- Header section -->
<div id="header">
<h1>e-Ticket <span>Your Campus Cinema</span></h1>
</div>

<!-- Main ticket booking section -->
<div id="content">
<h2>Book Your Ticket</h2>
<p> <!--link to go to next page-->
<a href="now_showing.html">View Now Showing Movies</a>
</p>
<p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>

<form action="booking.php"
oninput="total.value = Number(adult.value) + Number(child.value);
price.value = (Number(adult.value) * 12) + (Number(child.value) * 8)">

        <!-- Customer details -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
        placeholder="Enter your name" required autofocus>
        <br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"
        placeholder="example@email.com" required>
        <br>

        <!-- Phone number input -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
        placeholder="012-3456789" required>
        <br>

        <!-- Show date and time -->
        <label for="date">Show date:</label>
        <input type="date" id="date" name="date" required>
        <br>

        <label for="time">Show time:</label>
        <input type="time" id="time" name="time" required>
        <br>

        <!-- Movie selection with suggestions -->
        <label for="movie">Movie:</label>
        <input type="text" id="movie" name="movie" list="movies" required>

        <datalist id="movies">
            <option value="Space Rangers">
            <option value="Kampung Comedy">
            <option value="The Last Adventure">
        </datalist>
        <br>

        <!-- Ticket quantity -->
        <label for="adult">Adult tickets (RM12):</label>
        <input type="number" id="adult" name="adult"
        value="0" min="0" required>
        <br>

        <label for="child">Child tickets (RM8):</label>
        <input type="number" id="child" name="child"
        value="0" min="0" required>
        <br>

        <!-- Service rating -->
        <label for="rating">Rate our service:</label>
        <input type="range" id="rating" name="rating"
        min="1" max="5" value="3">
        <br>

        <!-- Display total number of tickets -->
        Total tickets:
        <output name="total" for="adult child">0</output>
        <br>

        <!-- Display total ticket price -->
        Total price (RM):
        <output name="price" for="adult child">0</output>
        <br>
        <input type="submit" value="Book Now">

</form>
</div>

<!-- Footer section -->
<div id="footer">
<p>&copy; 2026 CineKampus. All rights reserved.</p>
<p>e-Ticket&reg; – Campus Cinema &lt; RM10 every Tuesday &amp; Thursday</p>
</div>

</body>
</html>
