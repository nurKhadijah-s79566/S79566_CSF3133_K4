<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Student Grade Calculator</h1>

        <!-- Form calls checkMark() when the user submits it.
             return prevents the browser from refreshing the page. -->
        <form name="gradeForm" onsubmit="return checkMark()">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter student name">

            <label for="mark">Mark (0-100):</label>
            <input type="text" id="mark" name="mark" placeholder="Enter mark">

            <div class="buttons">
                <button type="submit">Check Grade</button>
                <button type="button" onclick="generateRandomMark()">Random Mark</button>
            </div>
        </form>

        <!-- JavaScript displays the grade result and checking time here. -->
        <div class="result-area">
            <p id="result" aria-live="polite"></p>
            <p id="checkedTime"></p>
        </div>

        <!-- Button displays the grade reference table. -->
        <button type="button" onclick="showTable()">Show Grade Table</button>
        <div id="tableContainer"></div>
    </main>

    <!-- External JavaScript file -->
    <script src="grade.js"></script>
</body>
</html>
